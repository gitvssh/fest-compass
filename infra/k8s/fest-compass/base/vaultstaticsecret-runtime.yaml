# The TourAPI key is issued by data.go.kr once per account and every subscribed
# API shares it. The homelab keeps one canonical document for that provider key
# and each consumer projects it under the variable name its own code expects, so
# rotation is a single-document change instead of a hunt for copies. FEST
# Compass therefore reads the shared document rather than seeding a private
# copy; its Vault policy grants read on exactly this path, not external-api/*.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: fest-compass-runtime
  labels:
    app.kubernetes.io/name: fest-compass
    app.kubernetes.io/component: runtime-credentials
    app.kubernetes.io/part-of: fest-compass
spec:
  vaultAuthRef: fest-compass
  mount: kv
  type: kv-v2
  path: projects/external-api/data-go-kr
  refreshAfter: 1h
  destination:
    name: fest-compass-runtime
    create: true
    transformation:
      # The shared document's field name is provider-neutral. Project it under
      # the application's own name and emit nothing else.
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        TOUR_API_KEY:
          text: |-
            {{- get .Secrets "service_key" -}}
  rolloutRestartTargets:
    - kind: Deployment
      name: fest-compass
