apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fest-compass

resources:
  - ../../base
  - namespace.yaml
  - httproute.yaml

images:
  - name: registry.damecasol.com/fest-compass/web
    newName: registry.damecasol.com/fest-compass/web
    digest: sha256:d4d655f8c4f087fa34987ead203f816cbeeddb52a7d0e1beb3ef373a76cf9799

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: fest-compass
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          observability.damecasol.com/service-version: sha256:d4d655f8c4f087fa34987ead203f816cbeeddb52a7d0e1beb3ef373a76cf9799
