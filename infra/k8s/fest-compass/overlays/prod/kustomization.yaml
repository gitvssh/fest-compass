  - namespace.yaml
  - httproute.yaml

images:
  - name: registry.damecasol.com/fest-compass/web
    newName: registry.damecasol.com/fest-compass/web
    digest: sha256:0f2e11eac39bde149f6ee09e3f4a42b666b6115a43daf778f5caae5e82920f88

patches:
