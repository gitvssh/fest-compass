apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fest-compass

resources:
  - ../../base
  - namespace.yaml
  - httproute.yaml

images:
  - name: registry.damecasol.com/fest-compass/web
    newName: registry.damecasol.com/fest-compass/web
    digest: sha256:3194d2c0a289fe64e83e7117a3e2863686251b1650434c13a56dc1c413c617f8

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: fest-compass
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          observability.damecasol.com/service-version: sha256:3194d2c0a289fe64e83e7117a3e2863686251b1650434c13a56dc1c413c617f8
