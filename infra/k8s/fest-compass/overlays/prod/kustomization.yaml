  - namespace.yaml
  - httproute.yaml

images:
  - name: registry.damecasol.com/fest-compass/web
    newName: registry.damecasol.com/fest-compass/web
    digest: sha256:b83bba2bc9c0604d919109148cf2542b5c60935e57486d5d7d492810446106e5

patches:
