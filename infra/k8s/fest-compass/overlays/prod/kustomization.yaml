      group: apps
      version: v1
      kind: Deployment
      name: fest-compass
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          observability.damecasol.com/service-version: sha256:6b5f271087a7080f3b444beb666b279a5e6d10f325397cf8aabcb037b598381d
