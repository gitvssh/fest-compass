      group: apps
      version: v1
      kind: Deployment
      name: fest-compass
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          observability.damecasol.com/service-version: sha256:fb147f9cdc5156ffb35431cc07ccc188f152092cd36e9201c92fac8f61dc133b
