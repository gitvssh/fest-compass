apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fest-compass
  labels:
    app.kubernetes.io/name: fest-compass
    app.kubernetes.io/part-of: fest-compass
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: kube-system
      sectionName: websecure-fest-compass-public
  hostnames:
    - kto.damecasol.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: fest-compass
          port: 80
